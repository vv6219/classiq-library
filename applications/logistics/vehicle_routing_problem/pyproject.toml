[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-routing-problem"
version = "0.1.0"
description = "Quantum Capacitated Vehicle Routing Problem (CVRP) & WMS Dispatch Pipeline using Classiq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "classiq",
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
    "networkx",
    "reportlab",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
