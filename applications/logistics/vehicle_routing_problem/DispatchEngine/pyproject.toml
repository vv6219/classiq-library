[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DispatchEngine"
version = "1.0.0"
description = "Industrial Multi-Tier Warehouse Optimization Engine (SC-QFCM & Classiq Quantum Co-Processor)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quantum Optimization Team" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "ortools>=9.7.0",
    "shapely>=2.0.0",
    "rtree>=1.0.0",
    "classiq>=0.40.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.80.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
