<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DispatchEngine API - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://fastapi.tiangolo.com/img/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #090d16;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Top Navigation HUD */
    .engine-nav {
      background: #0f172a;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .engine-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .engine-logo-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #040812;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .engine-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .engine-subtitle {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 500;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .nav-btn-active {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .nav-btn-idle {
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-btn-idle:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .nav-btn-accent {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.3));
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .nav-btn-accent:hover {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.45));
      color: #6ee7b7;
    }
    /* Swagger Customizations */
    .swagger-ui {
      background: #090d16;
      color: #e2e8f0;
      padding-bottom: 60px;
    }
    .swagger-ui .topbar {
      display: none !important;
    }
    .swagger-ui .info {
      margin: 25px 0 20px 0;
    }
    .swagger-ui .info .title {
      color: #f8fafc;
      font-weight: 800;
      font-size: 28px;
    }
    .swagger-ui .info p, .swagger-ui .info li {
      color: #94a3b8;
    }
    .swagger-ui .scheme-container {
      background: #0f172a;
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 12px 20px;
    }
    .swagger-ui .opblock-tag {
      color: #f1f5f9 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      font-size: 18px;
      font-weight: 700;
    }
    .swagger-ui .opblock {
      background: #0f172a !important;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
    }
    .swagger-ui .opblock .opblock-summary {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .swagger-ui .opblock-summary-path {
      color: #f8fafc !important;
      font-family: 'JetBrains Mono', monospace !important;
    }
    .swagger-ui .opblock-description-wrapper p, .swagger-ui .opblock-external-docs-wrapper p, .swagger-ui .opblock-title_normal p {
      color: #94a3b8;
    }
    .swagger-ui table thead tr td, .swagger-ui table thead tr th {
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .swagger-ui .parameter__name {
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
    }
    .swagger-ui .parameter__type {
      color: #a78bfa;
    }
    .swagger-ui input[type=text], .swagger-ui textarea, .swagger-ui select {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 6px !important;
    }
    .swagger-ui .btn {
      border-radius: 6px !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 600 !important;
    }
    .swagger-ui .btn.execute {
      background-color: #0284c7 !important;
      border-color: #0284c7 !important;
      color: #fff !important;
    }
    .swagger-ui .model-box {
      background: #0f172a !important;
    }
    .swagger-ui section.models {
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 8px;
      background: #0f172a;
    }
    .swagger-ui section.models h4 {
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <nav class="engine-nav">
    <a href="/" class="engine-brand">
      <span class="engine-logo-badge">VRP-Q</span>
      <div>
        <div class="engine-title">DispatchEngine API Documentation</div>
        <div class="engine-subtitle">Extended Rich Multi-Depot VRPTW &middot; Classiq Quantum Co-Processor</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-btn nav-btn-idle">&larr; 3D Digital Twin Simulator</a>
      <a href="/docs" class="nav-btn nav-btn-active">📖 Swagger UI</a>
      <a href="/redoc" class="nav-btn nav-btn-idle">📕 ReDoc</a>
      <a href="/sqlite" class="nav-btn nav-btn-idle">💾 SQLite Studio</a>
      <a href="/openapi.json" target="_blank" class="nav-btn nav-btn-idle">📄 OpenAPI 3.1.0</a>
      <a href="/dispatchengine.db" download class="nav-btn nav-btn-accent">📥 dispatchengine.db (626 KB)</a>
    </div>
  </nav>

  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        filter: true,
        showRequestDuration: true,
        tryItOutEnabled: true,
      });
    };
  </script>
</body>
</html>
