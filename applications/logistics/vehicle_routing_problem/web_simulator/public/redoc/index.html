  <script>
    function renderMathFormulas(rootElement) {
      if (!window.renderMathInElement || !rootElement) return;
      try {
        window.renderMathInElement(rootElement, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false,
          errorColor: "#f43f5e",
          ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
          ignoredClasses: ["katex", "katex-html", "katex-mathml"]
        });
      } catch (err) {
        console.warn("KaTeX render error in ReDoc:", err);
      }
    }

    Redoc.init('/openapi.json', {
      expandResponses: "200,201",
      theme: {
        colors: {
          primary: { main: '#0284c7' },
          text: { primary: '#f8fafc', secondary: '#94a3b8' },
          http: { get: '#0284c7', post: '#059669', put: '#d97706', delete: '#e11d48' }
        }
      }
    }, document.getElementById('redoc-container'), () => {
      setTimeout(() => renderMathFormulas(document.body), 100);
      setTimeout(() => renderMathFormulas(document.body), 800);
      setTimeout(() => renderMathFormulas(document.body), 2000);
    });

    // MutationObserver for ReDoc scroll & lazy loading
    if (window.MutationObserver) {
      let redocTimer = null;
      const observer = new MutationObserver(() => {
        clearTimeout(redocTimer);
        redocTimer = setTimeout(() => {
          renderMathFormulas(document.body);
        }, 60);
      });
      observer.observe(document.body, { childList: true, subtree: true });
    }
  </script>
