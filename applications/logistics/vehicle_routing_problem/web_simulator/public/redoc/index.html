<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .engine-nav {
      background: #0f172a;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .engine-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .engine-logo-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #040812;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .engine-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .engine-subtitle {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 500;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .nav-btn-active {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .nav-btn-idle {
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-btn-idle:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .nav-btn-accent {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.3));
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .nav-btn-accent:hover {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.45));
      color: #6ee7b7;
    }

</head>

  <nav class="engine-nav">

      <a href="/redoc" class="nav-btn nav-btn-active">📕 ReDoc</a>

      <a href="/dispatchengine.db" download class="nav-btn nav-btn-accent">📥 dispatchengine.db (626 KB)</a>
